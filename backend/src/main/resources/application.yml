spring:
  application:
    name: hito4
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  docker:
    compose:
      lifecycle-management: start-only
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tunegocio_db}
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:SecureDevPassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
